<script>

// ============ اختبار الاتصال ============
async function testConnection() {
  try {
    const { data, error } = await supabase.from('players').select('count').limit(1);
    if (error) {
      console.error('❌ فشل الاتصال بقاعدة البيانات:', error);
      document.getElementById('authMessage').textContent = 'خطأ في الاتصال بقاعدة البيانات. تأكد من إعدادات Supabase.';
      return false;
    }
    console.log('✅ تم الاتصال بقاعدة البيانات بنجاح');
    return true;
  } catch (e) {
    console.error('❌ خطأ في الاتصال:', e);
    return false;
  }
}

// ============ الحالة العامة ============
let appState = {
  authMode: 'register',
  user: null,
  player: {
    name: '',
    email: '',
    score: 0,
    xp: 0,
    coins: 0,
    tickets: 0,
    level: 0
  },
  game: {
    active: false,
    mode: '',
    timer: 30,
    score: 0,
    obstacles: [],
    coins: [],
    playerX: 45,
    speed: 3,
    interval: null,
    obstacleInterval: null,
    coinInterval: null,
    timerInterval: null
  }
};

const LEVELS = ['مبتدئ', 'متوسط', 'متقدم', 'محترف', 'خبير'];
const LEVEL_SPEEDS = [3, 5, 7, 9, 12];

// ============ دوال المساعدة ============
function $(id) {
  return document.getElementById(id);
}

function showToast(message, duration = 3000) {
  const toast = $('toast');
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => {
    if (toast) toast.classList.remove('show');
  }, duration);
}

// ============ المصادقة ============
async function handleAuth() {
  console.log('🚀 handleAuth called, mode:', appState.authMode);
  
  const emailInput = $('emailInput');
  const passwordInput = $('passwordInput');
  const playerNameInput = $('playerName');
  const authBtn = $('authButton');
  const authMsg = $('authMessage');
  
  if (!emailInput || !passwordInput) {
    showToast('خطأ في تحميل النموذج');
    return;
  }
  
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const name = playerNameInput ? playerNameInput.value.trim() : '';
  
  // التحقق من صحة المدخلات
  if (!email) {
    showToast('يرجى إدخال البريد الإلكتروني');
    return;
  }
  
  if (!password) {
    showToast('يرجى إدخال كلمة المرور');
    return;
  }
  
  if (password.length < 6) {
    showToast('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
    return;
  }
  
  if (appState.authMode === 'register' && !name) {
    showToast('يرجى إدخال اسم اللاعب');
    return;
  }
  
  if (authBtn) authBtn.disabled = true;
  if (authMsg) {
    authMsg.textContent = 'جاري المعالجة...';
    authMsg.style.color = '#94a3b8';
  }
  
  try {
    // اختبار الاتصال أولاً
    const connected = await testConnection();
    if (!connected) {
      if (authMsg) {
        authMsg.textContent = 'فشل الاتصال بقاعدة البيانات. تحقق من مفتاح Supabase.';
        authMsg.style.color = '#ef4444';
      }
      if (authBtn) authBtn.disabled = false;
      return;
    }
    
    let result;
    
    if (appState.authMode === 'register') {
      // إنشاء حساب جديد
      console.log('📝 Attempting signup...');
      result = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            username: name
          }
        }
      });
      
      console.log('Signup result:', result);
      
      if (result.error) {
        console.error('❌ Signup error:', result.error);
        throw result.error;
      }
      
      if (result.data.user) {
        appState.user = result.data.user;
        appState.player.email = email;
        appState.player.name = name;
        
        // إنشاء سجل اللاعب
        await createPlayerRecord();
        
        showToast('✅ تم إنشاء الحساب بنجاح!');
        enterApp();
      }
      
    } else {
      // تسجيل الدخول
      console.log('🔑 Attempting login...');
      result = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });
      
      console.log('Login result:', result);
      
      if (result.error) {
        console.error('❌ Login error:', result.error);
        throw result.error;
      }
      
      if (result.data.user) {
        appState.user = result.data.user;
        appState.player.email = email;
        appState.player.name = result.data.user.user_metadata?.username || 'لاعب';
        
        await loadPlayerData();
        showToast('✅ تم تسجيل الدخول بنجاح!');
        enterApp();
      }
    }
    
  } catch (error) {
    console.error('❌ Auth error details:', error);
    
    let errorMessage = 'حدث خطأ غير متوقع';
    
    if (error.message) {
      if (error.message.includes('User already registered')) {
        errorMessage = 'هذا البريد مسجل بالفعل. الرجاء تسجيل الدخول.';
      } else if (error.message.includes('Invalid login credentials')) {
        errorMessage = 'بريد إلكتروني أو كلمة مرور غير صحيحة';
      } else if (error.message.includes('Email not confirmed')) {
        errorMessage = 'يرجى تأكيد البريد الإلكتروني أولاً. أو تعطيل تأكيد البريد من إعدادات Supabase.';
      } else if (error.message.includes('Database error')) {
        errorMessage = 'خطأ في قاعدة البيانات. تأكد من وجود جدول players.';
      } else {
        errorMessage = error.message;
      }
    }
    
    if (authMsg) {
      authMsg.textContent = errorMessage;
      authMsg.style.color = '#ef4444';
    }
    showToast(errorMessage);
    
  } finally {
    if (authBtn) authBtn.disabled = false;
  }
}

async function createPlayerRecord() {
  try {
    console.log('📝 Creating player record...');
    const { data, error } = await supabase
      .from('players')
      .insert({
        player_key: appState.user.id,
        username: appState.player.name,
        tickets: 3,
        score: 0,
        xp: 0,
        coins: 0,
        level: 0
      })
      .select()
      .single();
    
    if (error) {
      console.error('❌ Create player error:', error);
      if (error.message.includes('duplicate key')) {
        console.log('⚠️ Player already exists, loading data...');
        await loadPlayerData();
      }
    } else if (data) {
      console.log('✅ Player created:', data);
      appState.player.score = data.score || 0;
      appState.player.xp = data.xp || 0;
      appState.player.coins = data.coins || 0;
      appState.player.tickets = data.tickets || 0;
      appState.player.level = data.level || 0;
    }
  } catch (error) {
    console.error('❌ Create player error:', error);
  }
}

async function loadPlayerData() {
  try {
    console.log('📖 Loading player data...');
    const { data, error } = await supabase
      .from('players')
      .select('*')
      .eq('player_key', appState.user.id)
      .maybeSingle();
    
    if (error) {
      console.error('❌ Load player error:', error);
      return;
    }
    
    if (data) {
      console.log('✅ Player data loaded:', data);
      appState.player.score = data.score || 0;
      appState.player.xp = data.xp || 0;
      appState.player.coins = data.coins || 0;
      appState.player.tickets = data.tickets || 0;
      appState.player.level = data.level || 0;
    } else {
      console.log('⚠️ No player record found, creating new one...');
      await createPlayerRecord();
    }
  } catch (error) {
    console.error('❌ Load player error:', error);
  }
}

async function savePlayerData() {
  if (!appState.user) return;
  
  try {
    const { error } = await supabase
      .from('players')
      .update({
        score: appState.player.score,
        xp: appState.player.xp,
        coins: appState.player.coins,
        tickets: appState.player.tickets,
        level: appState.player.level
      })
      .eq('player_key', appState.user.id);
    
    if (error) {
      console.error('❌ Save error:', error);
    }
  } catch (error) {
    console.error('❌ Save player error:', error);
  }
}

function enterApp() {
  $('authScreen').classList.add('hidden');
  $('mainApp').classList.remove('hidden');
  updateStats();
  goHome();
}

// ============ التهيئة ============
async function init() {
  console.log('🚀 Initializing app...');
  console.log('📡 Testing Supabase connection...');
  
  const connected = await testConnection();
  if (!connected) {
    console.error('❌ Cannot connect to Supabase. Check your credentials.');
  }
  
  try {
    const { data, error } = await supabase.auth.getSession();
    
    if (error) {
      console.error('❌ Session error:', error);
      return;
    }
    
    console.log('📋 Session data:', data);
    
    if (data.session?.user) {
      console.log('👤 User already logged in:', data.session.user.email);
      appState.user = data.session.user;
      appState.player.email = data.session.user.email;
      appState.player.name = data.session.user.user_metadata?.username || 'لاعب';
      await loadPlayerData();
      enterApp();
    } else {
      console.log('👤 No active session, showing login screen');
    }
  } catch (error) {
    console.error('❌ Init error:', error);
  }
}

// بدء التطبيق عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', init);

// ... باقي الدوال (المتجر، اللعب، إلخ) كما هي ...
</script>
