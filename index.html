<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>تحديات سريعة PRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#070a12;--card:#111726;--primary:#7c5cff;--muted:#8d96aa;--border:rgba(255,255,255,.08)}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{background:radial-gradient(circle at 10% 0%,rgba(124,92,255,.20),transparent 32%),var(--bg)}
button,input{font:inherit}button{border:0;cursor:pointer}
.hidden{display:none!important}
.login{min-height:100vh;max-width:520px;margin:auto;padding:25px;display:flex;align-items:center;justify-content:center}
.loginBox{text-align:center;width:100%}
.bigLogo{width:88px;height:88px;border-radius:28px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(135deg,#7c5cff,#b05cff);box-shadow:0 20px 55px rgba(124,92,255,.32)}
.loginBox h1{font-size:31px;margin:0 0 8px}
.loginBox p{color:var(--muted)}
.input{width:100%;height:55px;margin-bottom:11px;padding:0 17px;border-radius:16px;background:#111726;color:#fff;border:1px solid var(--border);outline:none;font-size:16px}
.primary{width:100%;height:55px;border-radius:17px;color:white;font-weight:900;background:linear-gradient(135deg,#7354ff,#a855f7);box-shadow:0 10px 28px rgba(124,92,255,.25)}
.primary:disabled{opacity:.6}
.secondary{width:100%;height:52px;border-radius:16px;color:white;font-weight:800;background:#191f30;border:1px solid var(--border)}
.toast{position:fixed;z-index:9999;top:20px;left:50%;transform:translate(-50%,-150px);background:#1a2030;border:1px solid var(--border);padding:14px 20px;border-radius:15px;font-size:14px;font-weight:800;transition:.3s;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.small{font-size:11px;color:var(--muted)}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="login" class="login">
<div class="loginBox">
<div class="bigLogo">⚡</div>
<h1>تحديات سريعة</h1>
<p id="authTitle">أنشئ حسابك وابدأ اللعب</p>

<div id="registerFields">
<input id="registerName" class="input" maxlength="20" placeholder="اسم اللاعب">
</div>

<input id="email" class="input" type="email" placeholder="البريد الإلكتروني">
<input id="password" class="input" type="password" placeholder="كلمة المرور">

<button id="authButton" class="primary" onclick="handleAuth()">إنشاء حساب</button>
<div style="height:10px"></div>
<button class="secondary" onclick="toggleAuth()"><span id="toggleText">لدي حساب بالفعل</span></button>
<p class="small" style="margin-top:15px">بياناتك محفوظة على حسابك</p>
</div>
</div>

<script>
const SUPABASE_URL = "https://hchporijrjgmcfayobpv.supabase.co";
const SUPABASE_KEY = "sb_publishable_sWU3nxqG1TiZ7hdu6bm5Xg_0at1AMEr";

let supabase = null;
let authMode = "register";
let isAuthLoading = false;

try {
  if (!window.supabase) {
    alert("خطأ: مكتبة Supabase ما تحملت. تأكد من الإنترنت.");
  } else {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    // alert("تم تحميل النظام بنجاح"); // شيل التعليق لو تبي تتأكد
  }
} catch (e) {
  alert("خطأ في تهيئة النظام: " + e.message);
}

function el(id){ return document.getElementById(id); }

function toast(msg){
  const t = el("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 3500);
}

function setAuthLoading(loading){
  isAuthLoading = loading;
  const btn = el("authButton");
  btn.disabled = loading;
  btn.textContent = loading ? "جاري التحميل..." : (authMode === "register" ? "إنشاء حساب" : "تسجيل الدخول");
}

function toggleAuth(){
  authMode = authMode === "register" ? "login" : "register";
  if(authMode === "register"){
    el("authTitle").textContent = "أنشئ حسابك وابدأ اللعب";
    el("authButton").textContent = "إنشاء حساب";
    el("toggleText").textContent = "لدي حساب بالفعل";
    el("registerFields").classList.remove("hidden");
  } else {
    el("authTitle").textContent = "سجل دخولك وتابع تقدمك";
    el("authButton").textContent = "تسجيل الدخول";
    el("toggleText").textContent = "إنشاء حساب جديد";
    el("registerFields").classList.add("hidden");
  }
}

async function handleAuth(){
  alert("1 - الزر اشتغل"); // رسالة تشخيص

  if(isAuthLoading) return;
  if(!supabase){
    alert("خطأ: النظام مو متصل");
    return;
  }

  const email = el("email").value.trim();
  const password = el("password").value;

  if(!email){
    alert("اكتب البريد الإلكتروني");
    return;
  }
  if(password.length < 6){
    alert("كلمة المرور لازم 6 أحرف على الأقل");
    return;
  }

  setAuthLoading(true);
  alert("2 - جاري إرسال الطلب...");

  try {
    if(authMode === "register"){
      const username = el("registerName").value.trim();
      if(username.length < 2){
        alert("اكتب اسم اللاعب");
        setAuthLoading(false);
        return;
      }

      alert("3 - جاري إنشاء الحساب...");

      const {data, error} = await supabase.auth.signUp({
        email: email,
        password: password
      });

      if(error){
        alert("خطأ من السيرفر: " + error.message);
        setAuthLoading(false);
        return;
      }

      if(!data.user){
        alert("ما تم إنشاء المستخدم");
        setAuthLoading(false);
        return;
      }

      alert("4 - الحساب انشأ، جاري حفظ بيانات اللاعب...");

      const {error: playerError} = await supabase.from("players").insert({
        auth_user_id: data.user.id,
        username: username,
        xp:0, coins:0, score:0, level:1,
        streak:0, best_streak:0,
        challenges_completed:0, questions_answered:0
      });

      if(playerError){
        alert("خطأ في حفظ اللاعب: " + playerError.message);
        setAuthLoading(false);
        return;
      }

      alert("تم بنجاح! الحساب جاهز ✅");
      
      if(data.session){
        location.reload();
      } else {
        alert("تحقق من بريدك ثم سجل دخول");
        toggleAuth();
      }

    } else {
      // تسجيل دخول
      alert("جاري تسجيل الدخول...");
      const {data, error} = await supabase.auth.signInWithPassword({
        email, password
      });

      if(error){
        alert("خطأ تسجيل الدخول: " + error.message);
        setAuthLoading(false);
        return;
      }

      alert("تم تسجيل الدخول بنجاح");
      location.reload();
    }
  } catch(e){
    alert("خطأ عام: " + e.message);
  }

  setAuthLoading(false);
}

// اختبار سريع عند فتح الصفحة
setTimeout(()=>{
  if(!window.supabase){
    alert("تحذير: مكتبة Supabase ما تحملت. جرب شبكة ثانية أو VPN.");
  }
}, 2000);
</script>
</body>
</html>
